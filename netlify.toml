[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"
  # Free tier soft target: keep searches under ~10s
  [functions.search]
    timeout = 26
  [functions.redgifs]
    timeout = 26
  [functions.gifmedia]
    timeout = 20
  [functions.buddy]
    timeout = 26

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/thumbnail"
  to = "/.netlify/functions/thumbnail"
  status = 200

[[redirects]]
  from = "/api/redgifs"
  to = "/.netlify/functions/redgifs"
  status = 200

[[redirects]]
  from = "/api/gifmedia"
  to = "/.netlify/functions/gifmedia"
  status = 200

[[redirects]]
  from = "/api/buddy"
  to = "/.netlify/functions/buddy"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/redgifs.html"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
