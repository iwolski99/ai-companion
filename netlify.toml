[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"
  # Free tier soft target: keep searches under ~10s
  [functions.search]
    timeout = 26
  [functions.redgifs]
    timeout = 20

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/thumbnail"
  to = "/.netlify/functions/thumbnail"
  status = 200

[[redirects]]
  from = "/api/redgifs"
  to = "/.netlify/functions/redgifs"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
