<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Tubes · Buddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"></div>

    <header class="top">
      <div class="top-row">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>Buddy</h1>
        </a>
        <nav class="nav" aria-label="Main">
          <a class="nav-link is-active" href="/">Tubes</a>
          <a class="nav-link" href="/redgifs.html">RedGifs</a>
          <a class="nav-link" href="/foryou.html">For You</a>
          <a class="nav-link" href="/chat.html">Chat</a>
          <a class="nav-link" href="/calendar.html">Calendar</a>
        </nav>
      </div>
      <p class="tagline">Multi-site tube search · straight only · personal use</p>
    </header>

    <main class="shell">
      <form id="search-form" class="search" autocomplete="off">
        <label class="sr-only" for="q">Search query</label>
        <div class="search-row">
          <input
            id="q"
            name="q"
            type="search"
            enterkeyhint="search"
            placeholder="Search videos…"
            maxlength="200"
            autofocus
          />
          <button type="submit" id="search-btn" class="btn-primary">
            Search
          </button>
        </div>

        <details class="advanced">
          <summary>Filters &amp; options</summary>
          <div class="advanced-grid">
            <fieldset class="sources">
              <legend>
                Sources
                <span id="site-count" class="site-count">0/5</span>
              </legend>
              <p class="sources-hint">Pick up to 5 sites per search. Gay / bi results are filtered out.</p>
              <label><input type="checkbox" name="site" value="xvideos" checked /> XVideos</label>
              <label><input type="checkbox" name="site" value="xnxx" checked /> XNXX</label>
              <label><input type="checkbox" name="site" value="xhamster" checked /> xHamster</label>
              <label><input type="checkbox" name="site" value="pornhub" checked /> PornHub</label>
              <label><input type="checkbox" name="site" value="youporn" checked /> YouPorn</label>
              <label><input type="checkbox" name="site" value="spankbang" /> SpankBang</label>
              <label><input type="checkbox" name="site" value="bdsmstreak" /> BDSMStreak</label>
            </fieldset>

            <div class="opts">
              <label class="field">
                <span>Sort</span>
                <select id="sort">
                  <option value="relevance">Relevance (interleaved)</option>
                  <option value="source">Source</option>
                  <option value="duration">Duration</option>
                  <option value="views">Views</option>
                </select>
              </label>
              <label class="field">
                <span>Password</span>
                <input
                  id="password"
                  type="password"
                  placeholder="If required"
                  autocomplete="current-password"
                />
              </label>
              <label class="check">
                <input type="checkbox" id="proxy-thumbs" />
                Proxy thumbnails
              </label>
            </div>
          </div>
        </details>
      </form>

      <section id="status" class="status" aria-live="polite" hidden></section>
      <section id="meta" class="meta" hidden></section>
      <nav id="pager-top" class="pager" hidden></nav>
      <section id="results" class="results" aria-label="Search results"></section>
      <nav id="pager-bottom" class="pager" hidden></nav>
    </main>

    <footer class="foot">
      <p>Personal use only. Clicks train your For You tags. Results open on original hosts.</p>
    </footer>

    <script src="/prefs.js"></script>
    <script src="/app.js" defer></script>
  </body>
</html>
