<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Chat · Buddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="chat-page">
    <div class="bg-glow" aria-hidden="true"></div>
    <header class="top">
      <div class="top-row">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>Buddy</h1>
        </a>
        <nav class="nav" aria-label="Main">
          <a class="nav-link" href="/">Tubes</a>
          <a class="nav-link" href="/redgifs.html">Gifs</a>
          <a class="nav-link" href="/foryou.html">For You</a>
          <a class="nav-link is-active" href="/chat.html">Chat</a>
          <a class="nav-link" href="/calendar.html">Calendar</a>
        </nav>
      </div>
      <p class="tagline">Saved locally · filthy goon buddy · straight only</p>
    </header>

    <main class="chat-layout">
      <button type="button" class="btn-ghost chat-menu-btn" id="chat-menu" aria-label="Open chats">
        Chats
      </button>
      <div class="chat-scrim" id="chat-scrim" hidden></div>
      <aside class="chat-sidebar" id="chat-sidebar">
        <button type="button" class="btn-primary chat-new" id="chat-new">New chat</button>
        <ul class="chat-list" id="chat-list"></ul>
      </aside>
      <section class="chat-main">
        <div id="chat-log" class="chat-log" aria-live="polite"></div>
        <form id="chat-form" class="chat-form" autocomplete="off">
          <label class="sr-only" for="chat-input">Message</label>
          <textarea
            id="chat-input"
            rows="2"
            maxlength="4000"
            placeholder="Talk filthy…"
            required
          ></textarea>
          <button type="submit" class="btn-primary" id="chat-send">Send</button>
        </form>
        <p class="muted chat-hint" id="chat-hint">Chats stay on this device until you delete them.</p>
      </section>
    </main>

    <script src="/prefs.js"></script>
    <script src="/chat.js" defer></script>
  </body>
</html>
