<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Saved · GoonHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=skip-1" />
    <script src="/vault.js?v=pink-1"></script>
    <script src="/nav.js?v=pink-1"></script>
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"></div>
    <header class="top">
      <div class="top-row">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>GoonHub</h1>
        </a>
        <nav class="nav" aria-label="Main">
          <a class="nav-link" href="/">Tubes</a>
          <a class="nav-link" href="/redgifs.html">Gifs</a>
          <a class="nav-link" href="/tease.html">Tease</a>
          <a class="nav-link" href="/foryou.html">For You</a>
          <a class="nav-link is-active" href="/bookmarks.html">Saved</a>
          <a class="nav-link" href="/chat.html">Chat</a>
          <a class="nav-link" href="/calendar.html">Calendar</a>
        </nav>
      </div>
      <p class="tagline">Bookmarked clips with the same mute-loop previews as Gifs</p>
    </header>

    <main class="shell">
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">Saved</h2>
          <button type="button" class="btn-ghost" id="export-bm">Export JSON</button>
        </div>
        <p class="muted" id="bm-empty" hidden>Nothing saved yet — star a clip on Gifs or Tease.</p>
        <div id="bm-grid" class="rg-grid"></div>
      </section>
    </main>

    <dialog id="rg-modal" class="player-modal">
      <div class="player-stage">
        <div class="player-bar">
          <button type="button" class="btn-ghost" id="rg-close">Close</button>
          <div class="rg-actions player-actions">
            <button type="button" class="icon-btn is-on" id="rg-save" aria-label="Remove bookmark">★</button>
          </div>
          <a id="rg-open-ext" class="btn-ghost" target="_blank" rel="noopener">Open original</a>
        </div>
        <div class="player-frame-wrap">
          <video
            id="rg-video"
            controls
            playsinline
            loop
            preload="auto"
            referrerpolicy="no-referrer"
          ></video>
          <iframe
            id="rg-iframe"
            title="Clip player"
            hidden
            allow="autoplay; fullscreen; encrypted-media"
            allowfullscreen
          ></iframe>
        </div>
        <div class="player-skip">
          <button type="button" class="player-skip-btn" id="rg-prev" aria-label="Previous clip">↑</button>
          <button type="button" class="player-skip-btn" id="rg-next" aria-label="Next clip">↓</button>
        </div>
      </div>
    </dialog>

    <footer class="foot">
      <p>Saved clips sync with your profile key.</p>
    </footer>
    <script src="/prefs.js?v=scroll-1"></script>
    <script src="/gif-preview.js?v=scroll-1"></script>
    <script src="/gif-skip.js?v=skip-1"></script>
    <script src="/bookmarks.js?v=skip-1" defer></script>
  </body>
</html>
